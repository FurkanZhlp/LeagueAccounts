name: Build (Windows)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install stable Rust and Clippy
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install frontend dependencies
        run: npm ci
      # The Tauri shell embeds ../dist at compile time, so build the UI first.
      - name: Type-check and build the UI
        run: npm run build
      - name: Unit and regression tests
        run: cargo +stable test --locked --workspace --all-targets
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Release build
        run: npx tauri build --no-bundle
